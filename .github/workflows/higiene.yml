# Testigo público de las guardas de higiene. La puerta de verdad corre antes, en el repositorio privado,
# porque ve lo que desde aquí no se puede comprobar sin publicarlo.
name: higiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0          # el test de correos lee todo el historial
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -q
