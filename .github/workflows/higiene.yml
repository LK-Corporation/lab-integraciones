# Testigo público de las guardas de higiene. La puerta de verdad corre antes, en el repositorio privado,
# porque ve lo que desde aquí no se puede comprobar sin publicarlo.
name: higiene

on: [push, pull_request]

permissions:
  contents: read

jobs:
  higiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # el test de correos lee todo el historial
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -q
